services:
  gateway:
    build: .
    environment:
      GATEWAY_API_KEYS: change-this-key
      AUTH_SERVICE_URL: http://auth:4101
      USERS_SERVICE_URL: http://users:4102
      BILLING_SERVICE_URL: http://billing:4103
      ACCESS_LOG_PATH: /app/logs/access.jsonl
    ports: ["4000:4000"]
    volumes: [gateway-logs:/app/logs]
    depends_on: [auth, users, billing]
  auth: { build: ., command: node src/services/auth.js }
  users: { build: ., command: node src/services/users.js }
  billing: { build: ., command: node src/services/billing.js }
volumes:
  gateway-logs:
